<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>重置工作人员密码｜小额周转贷</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#ecf4ff,#f8fbff);color:#152033;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e4ebf5;border-radius:22px;padding:30px;box-shadow:0 24px 70px rgba(18,52,94,.13)}h1{margin:0 0 8px}.muted{color:#6c7889}.field{margin-top:14px}.field label{display:block;font-size:13px;color:#5b6677;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d9e1ec;border-radius:10px;font:inherit}.btn{margin-top:16px;width:100%;border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:700;background:#1769e0;color:#fff;cursor:pointer}.msg{margin-top:12px;font-size:13px;white-space:pre-wrap}.err{color:#b42318}.ok{color:#087a4b}</style>
</head>
<body>
<div class="card">
<h1>重置工作人员密码</h1>
<p class="muted">小额周转贷工作人员后台</p>
<div class="field"><label>新密码</label><input id="p1" type="password" autocomplete="new-password" placeholder="至少8位"></div>
<div class="field"><label>再次输入新密码</label><input id="p2" type="password" autocomplete="new-password" placeholder="再次输入"></div>
<button id="btn" class="btn">确认重置密码</button>
<div id="msg" class="msg"></div>
</div>
<script>
(function(){
'use strict';
var AUTH='https://ep-broad-haze-aw0tk2ug.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth';
var token=new URLSearchParams(location.search).get('token');
var msg=document.getElementById('msg');
if(!token){msg.className='msg err';msg.textContent='重置链接无效或缺少 token，请重新申请密码重置邮件。';}
document.getElementById('btn').onclick=async function(){
  var p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(!token)return;
  if(p1.length<8){msg.className='msg err';msg.textContent='新密码至少8位。';return}
  if(p1!==p2){msg.className='msg err';msg.textContent='两次输入的密码不一致。';return}
  msg.className='msg';msg.textContent='正在重置…';
  try{
    var r=await fetch(AUTH+'/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({newPassword:p1,token:token})});
    var t=await r.text(),b=null;try{b=t?JSON.parse(t):null}catch(e){b=t}
    if(!r.ok)throw new Error((b&&((b.message)||(b.error&&b.error.message)||b.error))||t||('HTTP '+r.status));
    msg.className='msg ok';msg.textContent='密码已重置成功。正在返回后台登录页…';
    setTimeout(function(){location.href='./'},1500);
  }catch(e){msg.className='msg err';msg.textContent='重置失败：'+(e&&e.message?e.message:e);}
};
})();
</script>
</body>
</html>
