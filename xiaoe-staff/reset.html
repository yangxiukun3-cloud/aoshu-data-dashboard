<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>工作人员密码重置</title><style>body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#f4f7fb;margin:0;padding:24px;color:#152033}.card{max-width:460px;margin:8vh auto;background:#fff;border:1px solid #e5ebf3;border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(20,40,80,.09)}h1{margin:0 0 8px}.muted{color:#6b7788;font-size:14px}.ok{color:#087a4b}.err{color:#b42318;white-space:pre-wrap}.field{margin-top:16px}.field label{display:block;margin-bottom:6px;font-size:13px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7e0ec;border-radius:10px;font-size:16px}.btn{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:700;font-size:16px}.btn:disabled{opacity:.5}.box{margin-top:14px;padding:12px;border-radius:10px;background:#f7f9fc}.hidden{display:none}</style></head><body><div class="card"><h1>工作人员密码重置</h1><div class="muted">仅用于已存在的工作人员登录会话。不会创建新客户账号。</div><div id="state" class="box">正在检查当前后台会话…</div><div id="form" class="hidden"><div class="field"><label>工作人员账号</label><input id="email" readonly></div><div class="field"><label>新密码</label><input id="p1" type="password" autocomplete="new-password" placeholder="至少8位"></div><div class="field"><label>再次输入新密码</label><input id="p2" type="password" autocomplete="new-password" placeholder="再次输入"></div><button id="go" class="btn">确认重置密码</button><div id="msg" class="box hidden"></div></div></div><script>(function(){'use strict';var AUTH='https://ep-broad-haze-aw0tk2ug.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth';var DATA='https://ep-broad-haze-aw0tk2ug.apirest.c-12.us-east-1.aws.neon.tech/neondb/rest/v1';var S={jwt:null,user:null};function $(x){return document.getElementById(x)}function parse(t){try{return t?JSON.parse(t):null}catch(e){return t}}async function req(path,opt){opt=opt||{};var r=await fetch(AUTH+path,{method:opt.method||'GET',headers:Object.assign({'Content-Type':'application/json'},opt.headers||{}),body:opt.body,credentials:'include'});var text=await r.text(),b=parse(text);var h=r.headers.get('set-auth-jwt');if(h)S.jwt=h;var j=b&&((b.session&&b.session.access_token)||(b.data&&b.data.session&&b.data.session.access_token)||b.token||(b.data&&b.data.token));if(j)S.jwt=j;var u=b&&((b.user)||(b.data&&b.data.user)||(b.session&&b.session.user)||(b.data&&b.data.session&&b.data.session.user));if(u)S.user=u;if(!r.ok)throw new Error((b&&((b.message)||(b.error&&b.error.message)||b.error))||text||('HTTP '+r.status));return b}async function api(path){if(!S.jwt){try{var t=await req('/token');var j=t&&(t.token||(t.data&&t.data.token));if(j)S.jwt=j}catch(e){}}if(!S.jwt)throw new Error('当前浏览器没有可用后台登录会话');var r=await fetch(DATA+'/'+path,{headers:{Authorization:'Bearer '+S.jwt,Accept:'application/json'}});var text=await r.text(),b=parse(text);if(!r.ok)throw new Error((b&&((b.message)||(b.details)))||text||('HTTP '+r.status));return b}async function boot(){try{await req('/get-session');if(!S.user)throw new Error('没有检测到已登录的工作人员会话');var staff=await api('staff_users?select=auth_user_id,display_name,role_code,active&auth_user_id=eq.'+encodeURIComponent(S.user.id));if(!staff||!staff[0]||!staff[0].active)throw new Error('当前账号不是有效工作人员');$('state').textContent='已恢复工作人员会话，可以设置新密码。';$('state').className='box ok';$('email').value=S.user.email||'';$('form').classList.remove('hidden')}catch(e){$('state').textContent='无法恢复会话：'+e.message+'\n请回到后台登录页重新打开后再试。';$('state').className='box err'}}$('go').onclick=async function(){var p1=$('p1').value,p2=$('p2').value,m=$('msg');m.classList.remove('hidden');if(p1.length<8){m.textContent='新密码至少8位';m.className='box err';return}if(p1!==p2){m.textContent='两次密码不一致';m.className='box err';return}this.disabled=true;try{await req('/admin/set-user-password',{method:'POST',body:JSON.stringify({userId:S.user.id,newPassword:p1})});m.textContent='密码已重置成功。现在可返回工作人员后台，用新密码登录。';m.className='box ok'}catch(e){m.textContent='重置失败：'+e.message;m.className='box err'}finally{this.disabled=false}};boot()})();</script></body></html>
