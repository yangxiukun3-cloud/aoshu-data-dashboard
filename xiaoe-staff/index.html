<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f3f6fb;color:#152033}.hidden{display:none!important}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#ecf4ff,#f8fbff)}.login-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 24px 70px rgba(18,52,94,.13);border:1px solid #e4ebf5}.logo{width:54px;height:54px;border-radius:16px;background:#1769e0;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;margin-bottom:16px}.muted{color:#6c7889}.small{font-size:12px}.field{margin-top:12px}.field label{display:block;font-size:13px;color:#5b6677;margin-bottom:6px}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:11px 12px;border:1px solid #d9e1ec;border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.toolbar input:focus,.toolbar select:focus{border-color:#1769e0;box-shadow:0 0 0 3px rgba(23,105,224,.09)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769e0;color:#fff}.btn:hover{filter:brightness(.98)}.btn.secondary{background:#eef3f8;color:#314155}.btn.success{background:#087a4b}.btn.danger{background:#b42318}.btn.warn{background:#b56a00}.btn.block{width:100%}.err{color:#b42318;font-size:13px;margin-top:10px;white-space:pre-wrap}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#14233f;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;padding:2px 10px 22px}.brand small{display:block;color:#8ea6c8;font-size:11px;font-weight:500;margin-top:5px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#c5d3e6;padding:12px 14px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#22395e;color:#fff}.sidefoot{position:absolute;left:14px;right:14px;bottom:18px}.main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.top-actions{display:flex;gap:8px;align-items:center}.cards{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px}.card,.section{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(20,50,90,.05);border:1px solid #e9eef5}.metric{font-size:28px;font-weight:900;margin-top:7px}.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff7e8;color:#835211;border:1px solid #f5d49b}.okbox{background:#ecf9f2;color:#16734b;border-color:#bce8d1}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 190px auto;gap:10px;margin:14px 0}.tablewrap{background:#fff;border-radius:14px;overflow:auto;border:1px solid #e9eef5}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:12px 14px;border-bottom:1px solid #edf1f6;text-align:left;font-size:14px;vertical-align:top}th{background:#fafcff;position:sticky;top:0;z-index:1}.link{color:#175cd3;font-weight:800;cursor:pointer}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:12px;white-space:nowrap}.badge.pending{background:#fff4dd;color:#8a5b00}.badge.pass{background:#eaf8ef;color:#16734b}.badge.reject{background:#fff0f0;color:#b42318}.drawer{position:fixed;inset:0;background:rgba(9,20,39,.42);display:flex;justify-content:flex-end;z-index:20}.panel{width:min(860px,97vw);height:100%;overflow:auto;background:#f5f8fc;padding:22px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:14px}.kv>div:nth-child(odd){color:#697586}.section{margin:12px 0}.section h3{margin:0 0 12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.media-card{background:#f8fafc;border:1px solid #e4eaf2;border-radius:12px;padding:8px}.media-card img,.media-card video{width:100%;height:180px;object-fit:contain;background:#111;border-radius:8px;cursor:pointer}.media-title{font-size:12px;color:#526174;margin-top:6px;word-break:break-all}.toast{position:fixed;right:22px;bottom:22px;background:#14233f;color:#fff;padding:12px 16px;border-radius:10px;z-index:40;max-width:min(560px,90vw);white-space:pre-wrap}.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}.viewer img,.viewer video{max-width:96vw;max-height:94vh;object-fit:contain}.sensitive{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}.statusline{font-size:12px;color:#607086;margin-top:4px}.version{font-size:11px;color:#8ca0bb;margin-top:4px}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{height:auto;position:static}.sidefoot{position:static;margin-top:14px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.main{padding:14px}.grid2,.grid3{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}.panel{width:100vw;padding:14px}.kv{grid-template-columns:120px 1fr}}
</style>

<body>
<div id="login" class="login"><div class="login-card"><div class="logo">贷</div><h1 style="margin:0">工作人员后台</h1><p class="muted">小额周转贷 · v7.0.2 Live</p><div class="field"><label>工作人员邮箱</label><input id="email" type="email" value="staff-admin-01@example.com" autocomplete="username"></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入工作人员密码"></div><button id="loginBtn" class="btn block" style="margin-top:16px">登录后台</button><div id="loginErr" class="err"></div><div class="notice small">审核、授信、放款状态均由工作人员人工操作。本后台不进行自动信用评分、自动授信或自动放款。</div></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">小额周转贷后台<small id="staffName">工作人员</small></div><div class="nav"><button class="active" data-page="dashboard">仪表盘</button><button data-page="applications">申请审核</button><button data-page="sms">短信记录</button></div><div class="sidefoot"><button id="logoutBtn" class="btn secondary block">退出登录</button><div class="version">v7.0.2-live · GitHub Pages</div></div></aside><main class="main"><div class="top"><div><h2 id="pageTitle" style="margin:0">仪表盘</h2><div id="cloudState" class="statusline">正在连接真实云端…</div></div><div class="top-actions"><button id="refreshBtn" class="btn secondary">刷新</button></div></div>
<section id="dashboardPage"><div class="cards"><div class="card"><div class="muted">全部申请</div><div id="mTotal" class="metric">-</div></div><div class="card"><div class="muted">待人工审核</div><div id="mPending" class="metric">-</div></div><div class="card"><div class="muted">已通过</div><div id="mPassed" class="metric">-</div></div><div class="card"><div class="muted">待打款/处理中</div><div id="mPayout" class="metric">-</div></div><div class="card"><div class="muted">短信待处理</div><div id="mSms" class="metric">-</div></div></div><div class="notice okbox">真实云端模式：客户 APP 与本后台读取同一 Neon 数据库；后台按唯一申请记录 ID 保存审核与收款资料，不使用列表第一条代替当前申请。</div></section>
<section id="applicationsPage" class="hidden"><div class="toolbar"><input id="q" placeholder="申请号 / 客户姓名 / 手机尾号"><select id="statusFilter"><option value="">全部审核状态</option><option>待人工审核</option><option>已通过</option><option>未通过</option></select><button id="searchBtn" class="btn">查询</button></div><div class="tablewrap"><table><thead><tr><th>申请号</th><th>客户</th><th>类型</th><th>申请金额</th><th>期限</th><th>审核状态</th><th>授信金额</th><th>贷款状态</th><th>打款状态</th><th>提交时间</th></tr></thead><tbody id="appRows"></tbody></table></div></section>
<section id="smsPage" class="hidden"><div class="tablewrap"><table><thead><tr><th>时间</th><th>申请号</th><th>客户</th><th>事件</th><th>模板</th><th>状态</th><th>错误</th></tr></thead><tbody id="smsRows"></tbody></table></div></section>
</main></div>
<div id="drawer" class="drawer hidden"><div class="panel"><div class="panel-head"><div><h2 id="dTitle" style="margin:0">申请详情</h2><div id="dSub" class="muted"></div></div><button id="closeDrawerBtn" class="btn secondary">关闭</button></div><div id="dBody"></div></div></div>
<div id="toast" class="toast hidden"></div><div id="viewer" class="viewer hidden"></div>
<script>
(function(){
'use strict';
var AUTH='https://ep-broad-haze-aw0tk2ug.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth';
var DATA='https://ep-broad-haze-aw0tk2ug.apirest.c-12.us-east-1.aws.neon.tech/neondb/rest/v1';
var S={jwt:null,user:null,staff:null,apps:[],customers:{},payouts:{},current:'dashboard',detail:null};
var $=function(id){return document.getElementById(id)};
function esc(v){return String(v===null||v===undefined?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v){if(v===null||v===undefined||v==='')return '—';var n=Number(v);return isFinite(n)?'¥'+n.toLocaleString('zh-CN',{maximumFractionDigits:2}):'—'}
function dt(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'}
function safeJson(v,d){try{return typeof v==='string'?JSON.parse(v):v||d}catch(e){return d}}
function toast(t){var e=$('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(function(){e.classList.add('hidden')},3200)}
function badgeClass(s){return s==='已通过'?'pass':s==='未通过'?'reject':'pending'}
function maskPhone(v){v=String(v||'');return v.length>=7?v.slice(0,3)+'****'+v.slice(-4):v}
function maskId(v){v=String(v||'');return v.length>10?v.slice(0,6)+'********'+v.slice(-4):v}
function maskCard(v){v=String(v||'').replace(/\s/g,'');return v.length>8?v.slice(0,4)+' **** **** '+v.slice(-4):v}
async function authReq(path,opt){opt=opt||{};var headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});var r=await fetch(AUTH+path,{method:opt.method||'GET',headers:headers,body:opt.body,credentials:'include'});var text=await r.text();var b=null;try{b=text?JSON.parse(text):null}catch(e){b=text}var h=r.headers.get('set-auth-jwt');if(h)S.jwt=h;var j=b&&((b.session&&b.session.access_token)||(b.data&&b.data.session&&b.data.session.access_token)||b.token||(b.data&&b.data.token));if(j&&String(j).split('.').length===3)S.jwt=j;var u=b&&((b.user)||(b.data&&b.data.user)||(b.session&&b.session.user)||(b.data&&b.data.session&&b.data.session.user));if(u)S.user=u;if(!r.ok)throw new Error((b&&((b.message)||(b.error&&b.error.message)||b.error))||text||('HTTP '+r.status));return b}
async function renewSession(){try{var b=await authReq('/get-session',{method:'GET'});var u=b&&((b.user)||(b.data&&b.data.user)||(b.session&&b.session.user)||(b.data&&b.data.session&&b.data.session.user));if(u)S.user=u}catch(e){}if(!S.jwt){try{var x=await authReq('/token',{method:'GET'});var t=x&&(x.token||(x.data&&x.data.token));if(t)S.jwt=t}catch(e2){}}return !!S.jwt}
async function api(path,opt,retry){opt=opt||{};if(retry===undefined)retry=true;if(!S.jwt){await renewSession()}if(!S.jwt)throw new Error('云端登录已失效，请重新登录');var r=await fetch(DATA+'/'+path,{method:opt.method||'GET',headers:Object.assign({Authorization:'Bearer '+S.jwt,Accept:'application/json','Content-Type':'application/json',Prefer:opt.prefer||'return=representation'},opt.headers||{}),body:opt.body===undefined?undefined:JSON.stringify(opt.body)});var text=await r.text();var b=null;try{b=text?JSON.parse(text):null}catch(e){b=text}if(!r.ok){var msg=(b&&((b.message)||(b.details)||(b.hint)))||String(b||text||('HTTP '+r.status));if(retry&&(r.status===401||/jwt|token.*expir|expired/i.test(msg))){S.jwt=null;await renewSession();if(S.jwt)return api(path,opt,false)}throw new Error(msg)}return b}
async function bestEffortAudit(action,key,details){try{await api('audit_logs',{method:'POST',body:{actor_auth_user_id:S.user&&S.user.id?action?S.user.id:null:null,action_code:action,entity_type:'loan_application',entity_key:String(key||''),details:JSON.stringify(details||{})}})}catch(e){console.warn('audit',e)}}
async function login(){var email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginErr').textContent='请输入工作人员邮箱和密码';return}$('loginErr').textContent='';$('loginBtn').disabled=true;try{await authReq('/sign-in/email',{method:'POST',body:JSON.stringify({email:email,password:password,rememberMe:true})});await renewSession();if(!S.user)throw new Error('未取得登录用户');var rows=await api('staff_users?select=*&auth_user_id=eq.'+encodeURIComponent(S.user.id));var staff=rows&&rows[0];if(!staff||staff.active!==true)throw new Error('该账号未获得工作人员权限');S.staff=staff;$('staffName').textContent=(staff.display_name||'工作人员')+' · '+(staff.role_code||'staff');showApp();await loadAll()}catch(e){$('loginErr').textContent='登录失败：'+e.message;S.jwt=null;S.user=null;S.staff=null}finally{$('loginBtn').disabled=false}}
async function logout(){try{await authReq('/sign-out',{method:'POST',body:'{}'})}catch(e){}S.jwt=null;S.user=null;S.staff=null;S.apps=[];S.customers={};S.payouts={};$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
function go(page){S.current=page;Array.prototype.forEach.call(document.querySelectorAll('.nav button'),function(b){b.classList.toggle('active',b.getAttribute('data-page')===page)});$('dashboardPage').classList.toggle('hidden',page!=='dashboard');$('applicationsPage').classList.toggle('hidden',page!=='applications');$('smsPage').classList.toggle('hidden',page!=='sms');$('pageTitle').textContent=page==='dashboard'?'仪表盘':page==='applications'?'申请审核':'短信记录';if(page==='dashboard')loadDashboard();if(page==='applications')renderApplications();if(page==='sms')loadSms()}
async function loadAll(){await Promise.all([loadCore(),loadSms(true)]);renderApplications();loadDashboard();$('cloudState').textContent='真实云端已连接 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}
async function loadCore(){var rs=await Promise.all([api('loan_applications?select=*&order=submitted_at.desc'),api('customers?select=*'),api('payout_records?select=*&order=id.desc')]);S.apps=rs[0]||[];S.customers={};(rs[1]||[]).forEach(function(c){S.customers[String(c.id)]=c});S.payouts={};(rs[2]||[]).forEach(function(p){var k=String(p.application_id);if(!S.payouts[k])S.payouts[k]=p})}
function loadDashboard(){var total=S.apps.length,pending=0,passed=0,payout=0;S.apps.forEach(function(a){if(a.status==='待人工审核'||a.status==='待审核')pending++;if(a.status==='已通过')passed++;var p=S.payouts[String(a.id)];if(p&&(p.payout_status==='待打款'||p.payout_status==='打款处理中'))payout++});$('mTotal').textContent=total;$('mPending').textContent=pending;$('mPassed').textContent=passed;$('mPayout').textContent=payout}
function renderApplications(){var query=$('q').value.trim().toLowerCase(),sf=$('statusFilter').value;var rows=S.apps.filter(function(a){var c=S.customers[String(a.customer_id)]||{};var hay=[a.application_no,c.display_name,c.customer_key,c.phone_last4].join(' ').toLowerCase();return (!query||hay.indexOf(query)>=0)&&(!sf||a.status===sf)});$('appRows').innerHTML=rows.map(function(a){var c=S.customers[String(a.customer_id)]||{};var p=S.payouts[String(a.id)]||{};var typ=a.purpose_code==='SPECIAL_LOAN'?'特色贷':'普通贷款';return '<tr><td><span class="link" data-open="'+esc(a.id)+'">'+esc(a.application_no)+'</span></td><td>'+esc(c.display_name||c.customer_key||'客户')+'<br><span class="muted small">尾号 '+esc(c.phone_last4||'—')+'</span></td><td>'+esc(typ)+'</td><td>'+money(a.apply_amount)+'</td><td>'+esc(a.requested_term)+'个月</td><td><span class="badge '+badgeClass(a.status)+'">'+esc(a.status)+'</span></td><td>'+money(a.approved_amount)+'</td><td>'+esc(a.loan_status||'—')+'</td><td>'+esc(p.payout_status||'—')+'</td><td>'+dt(a.submitted_at)+'</td></tr>'}).join('')||'<tr><td colspan="10" class="muted">暂无匹配申请</td></tr>';Array.prototype.forEach.call(document.querySelectorAll('[data-open]'),function(x){x.onclick=function(){openDetail(x.getAttribute('data-open'))}})}
var LABELS={phone:'手机号',fullName:'姓名',idNumber:'身份证号',sex:'性别',birthday:'出生日期',idValidStart:'证件有效期开始',idValidEnd:'证件有效期结束',idLongTerm:'长期有效',registeredAddress:'户籍地址',province:'现居省份',city:'现居城市',district:'现居区/县',street:'街道/详细地址',housing:'住房情况',vehicle:'车辆情况',occupation:'职业',workUnit:'工作/经营主体',workAddress:'工作/经营地址',workYears:'从业/工作年限',monthlyIncome:'月收入',monthlyRepayCapacity:'每月可固定偿还金额',businessName:'经营主体',creditCode:'统一社会信用代码',contactRelation:'紧急联系人关系',contactName:'紧急联系人',contactPhone:'紧急联系人电话',bankName:'收款银行',bankHolder:'收款户名',bankCard:'收款卡号',bankPhone:'银行预留手机号',bankProvince:'开户省份',bankCity:'开户城市',bankDistrict:'开户区/县',bankBranch:'开户支行/详细地址',applyAmount:'申请金额',applyTerm:'申请期限'};
function profileDisplay(p){var keys=Object.keys(p||{}).filter(function(k){return !/^vip/.test(k)});return '<div class="kv">'+keys.map(function(k){var v=p[k];if(v===null||v===undefined||v==='')return '';var show=v;if(k==='phone'||k==='contactPhone'||k==='bankPhone')show=maskPhone(v);if(k==='idNumber')show=maskId(v);if(k==='bankCard')show=maskCard(v);return '<div>'+esc(LABELS[k]||k)+'</div><div>'+esc(show)+'</div>'}).join('')+'</div>'}
function collectMedia(obj,prefix,out){out=out||[];prefix=prefix||'';if(!obj)return out;if(typeof obj==='string'){if(/^data:(image|video)\//.test(obj))out.push({name:prefix||'文件',src:obj,type:obj.indexOf('data:video/')===0?'video':'image'});return out}if(Array.isArray(obj)){obj.forEach(function(v,i){collectMedia(v,prefix+' '+(i+1),out)});return out}if(typeof obj==='object'){Object.keys(obj).forEach(function(k){collectMedia(obj[k],prefix?prefix+' / '+k:k,out)})}return out}
function mediaGallery(x){var media=collectMedia(x,'',[]);if(!media.length)return '<div class="muted">未发现可预览的图片或视频资料</div>';return '<div class="gallery">'+media.map(function(m,i){if(m.type==='video')return '<div class="media-card"><video controls preload="metadata" src="'+m.src+'"></video><div class="media-title">'+esc(m.name)+'</div></div>';return '<div class="media-card"><img data-media-index="'+i+'" src="'+m.src+'"><div class="media-title">'+esc(m.name)+'</div></div>'}).join('')+'</div>'}
async function openDetail(id){try{var a=S.apps.find(function(x){return String(x.id)===String(id)});if(!a)throw new Error('申请不存在');var c=S.customers[String(a.customer_id)]||{};var rs=await Promise.all([api('review_events?select=*&application_id=eq.'+a.id+'&order=created_at.desc'),api('payout_records?select=*&application_id=eq.'+a.id+'&order=id.desc')]);var reviews=rs[0]||[],payouts=rs[1]||[];var pack=safeJson(a.encrypted_application,{}),profile=pack.profile||{};S.detail={a:a,c:c,reviews:reviews,payouts:payouts,pack:pack,profile:profile};$('dTitle').textContent='申请 '+a.application_no;$('dSub').textContent=(c.display_name||c.customer_key||'客户')+' · 手机尾号 '+(c.phone_last4||'—')+' · '+(a.purpose_code==='SPECIAL_LOAN'?'特色贷':'普通贷款');var p=payouts[0]||{};var html='';html+='<div class="section"><div class="split"><h3>人工审核</h3><span class="badge '+badgeClass(a.status)+'">'+esc(a.status)+'</span></div><div class="grid2"><div class="field"><label>客户申请金额</label><input value="'+esc(a.apply_amount)+'" disabled></div><div class="field"><label>客户申请期限</label><input value="'+esc(a.requested_term)+'个月" disabled></div><div class="field"><label>本次授信金额</label><input id="approvedAmount" type="number" min="1" value="'+esc(a.approved_amount||'')+'" placeholder="工作人员人工输入"></div><div class="field"><label>还款期限（月）</label><input id="approvedTerm" type="number" min="1" value="'+esc(a.approved_term||a.requested_term||'')+'"></div></div><div class="field"><label>审核原因</label><textarea id="reviewReason" rows="3" placeholder="人工审核说明"></textarea></div><div class="field"><label>改进建议（不通过时填写）</label><textarea id="reviewAdvice" rows="3" placeholder="给客户的改进建议"></textarea></div><div class="actions"><button id="passBtn" class="btn success">人工审核通过</button><button id="rejectBtn" class="btn danger">人工审核不通过</button></div></div>';
html+='<div class="section"><h3>客户申请资料</h3>'+profileDisplay(profile)+'</div>';
html+='<div class="section"><h3>客户上传资料</h3>'+mediaGallery(pack.media||pack)+'</div>';
html+='<div class="section"><h3>收款银行资料（保存到当前申请记录）</h3><div class="grid2"><div class="field"><label>银行</label><input id="bankName" value="'+esc(profile.bankName||'')+'"></div><div class="field"><label>户名</label><input id="bankHolder" value="'+esc(profile.bankHolder||'')+'"></div><div class="field"><label>卡号</label><input id="bankCard" class="sensitive" value="'+esc(profile.bankCard||'')+'"></div><div class="field"><label>预留手机</label><input id="bankPhone" value="'+esc(profile.bankPhone||'')+'"></div><div class="field"><label>省份</label><input id="bankProvince" value="'+esc(profile.bankProvince||'')+'"></div><div class="field"><label>城市</label><input id="bankCity" value="'+esc(profile.bankCity||'')+'"></div><div class="field"><label>区/县</label><input id="bankDistrict" value="'+esc(profile.bankDistrict||'')+'"></div><div class="field"><label>支行/详细地址</label><input id="bankBranch" value="'+esc(profile.bankBranch||'')+'"></div></div><div class="actions"><button id="saveBankBtn" class="btn">保存到当前申请</button></div><div class="muted small">仅修改资料不会自动向客户发送“资料已更新”通知。</div></div>';
html+='<div class="section"><h3>放款状态（人工登记）</h3><div class="grid2"><div class="field"><label>当前状态</label><select id="payoutStatus"><option>待打款</option><option>打款处理中</option><option>打款成功</option><option>打款失败</option></select></div><div class="field"><label>流水号</label><input id="txnRef" value="'+esc(p.txn_ref||'')+'"></div></div><div class="field"><label>失败原因</label><textarea id="failReason" rows="2">'+esc(p.fail_reason||'')+'</textarea></div><div class="field"><label>内部备注</label><textarea id="payoutNote" rows="2">'+esc(p.internal_note||'')+'</textarea></div><div class="actions"><button id="savePayoutBtn" class="btn warn">保存放款状态</button></div><div class="muted small">这里只记录人工处理状态，不连接银行接口、不自动转账。</div></div>';
html+='<div class="section"><h3>发送系统通知</h3><div class="field"><label>标题</label><input id="msgTitle" value="系统通知"></div><div class="field"><label>内容</label><textarea id="msgContent" rows="4"></textarea></div><div class="actions"><button id="sendMsgBtn" class="btn">发送到客户 APP</button></div></div>';
html+='<div class="section"><h3>审批历史</h3>'+(reviews.length?reviews.map(function(r){return '<p><b>'+esc(r.decision)+'</b> · '+dt(r.created_at)+'<br>'+esc(r.reason||'')+(r.advice?'<br><span class="muted">建议：'+esc(r.advice)+'</span>':'')+'</p>'}).join(''):'<div class="muted">暂无审批历史</div>')+'</div>';
$('dBody').innerHTML=html;$('drawer').classList.remove('hidden');$('payoutStatus').value=p.payout_status||'待打款';$('passBtn').onclick=function(){submitReview(true)};$('rejectBtn').onclick=function(){submitReview(false)};$('saveBankBtn').onclick=saveBank;$('savePayoutBtn').onclick=savePayout;$('sendMsgBtn').onclick=sendMessage;Array.prototype.forEach.call($('dBody').querySelectorAll('img[data-media-index]'),function(im){im.onclick=function(){openViewer(im.src,'image')}});Array.prototype.forEach.call($('dBody').querySelectorAll('video'),function(v){v.ondblclick=function(){openViewer(v.src,'video')}});await bestEffortAudit('VIEW_APPLICATION_DETAIL',a.application_no,{application_id:a.id})}catch(e){toast('详情加载失败：'+e.message)}}
function closeDrawer(){$('drawer').classList.add('hidden');S.detail=null}
function openViewer(src,type){var v=$('viewer');v.innerHTML=type==='video'?'<video controls autoplay src="'+src+'"></video>':'<img src="'+src+'">';v.classList.remove('hidden')}
async function submitReview(pass){if(!S.detail)return;var a=S.detail.a,c=S.detail.c;var amount=Number($('approvedAmount').value),term=Number($('approvedTerm').value),reason=$('reviewReason').value.trim(),advice=$('reviewAdvice').value.trim();if(pass&&(!(amount>0)||!(term>0))){toast('请填写本次授信金额和还款期限');return}if(!pass&&!reason){toast('审核不通过时请填写明确原因');return}if(!confirm(pass?'确认人工审核通过？':'确认人工审核不通过？'))return;var now=new Date().toISOString();try{await api('loan_applications?id=eq.'+a.id,{method:'PATCH',body:pass?{status:'已通过',approved_amount:amount,approved_term:term,allow_reapply:false,reviewed_at:now,updated_at:now}:{status:'未通过',allow_reapply:true,reviewed_at:now,updated_at:now}});await api('review_events',{method:'POST',body:{application_id:a.id,actor_auth_user_id:S.user.id,decision:pass?'已通过':'未通过',reason:reason,advice:advice,approved_amount:pass?amount:null,approved_term:pass?term:null}});var title,content;if(pass){title='贷款申请审核通过';content='您的贷款申请已审核通过。\n本次授信金额：¥'+Number(amount).toLocaleString('zh-CN')+'\n\n申请金额：¥'+Number(a.apply_amount).toLocaleString('zh-CN')+'\n还款期限：'+term+'个月\n审批状态：已通过\n\n请进入“申请记录”查看完整审批资料。'}else{title='贷款申请审核未通过';content='您的贷款申请审核未通过。\n原因：'+reason+'\n改进建议：'+(advice||'请根据审核提示完善资料后重新申请。')+'\n\n您可以完善资料后重新提交申请。'}await api('system_messages',{method:'POST',body:{customer_id:a.customer_id,application_id:a.id,category:'review_result',title:title,content:content}});await bestEffortAudit(pass?'REVIEW_APPROVE':'REVIEW_REJECT',a.application_no,{application_id:a.id,approved_amount:pass?amount:null,approved_term:pass?term:null});toast('审核结果已保存并回传客户');closeDrawer();await loadCore();renderApplications();loadDashboard()}catch(e){toast('审核保存失败：'+e.message)}}
async function saveBank(){if(!S.detail)return;var a=S.detail.a,pack=S.detail.pack||{},profile=pack.profile||{};['bankName','bankHolder','bankCard','bankPhone','bankProvince','bankCity','bankDistrict','bankBranch'].forEach(function(k){profile[k]=$(k).value.trim()});pack.profile=profile;try{await api('loan_applications?id=eq.'+a.id,{method:'PATCH',body:{encrypted_application:JSON.stringify(pack),updated_at:new Date().toISOString()}});await bestEffortAudit('UPDATE_PAYOUT_BANK',a.application_no,{application_id:a.id});toast('收款资料已保存到当前申请记录');await loadCore();S.detail.pack=pack;S.detail.profile=profile}catch(e){toast('保存失败：'+e.message)}}
async function savePayout(){if(!S.detail)return;var a=S.detail.a,status=$('payoutStatus').value,now=new Date().toISOString(),body={payout_status:status,payout_amount:a.approved_amount||null,txn_ref:$('txnRef').value.trim()||null,fail_reason:$('failReason').value.trim()||null,internal_note:$('payoutNote').value.trim()||null,updated_at:now};if(status==='打款处理中')body.started_at=now;if(status==='打款成功')body.completed_at=now;try{var p=S.detail.payouts[0];if(p)await api('payout_records?id=eq.'+p.id,{method:'PATCH',body:body});else{body.application_id=a.id;await api('payout_records',{method:'POST',body:body})}var loanStatus=status==='打款成功'?'已放款':status==='打款处理中'?'待放款':'未放款';await api('loan_applications?id=eq.'+a.id,{method:'PATCH',body:{loan_status:loanStatus,updated_at:now}});await bestEffortAudit('UPDATE_PAYOUT_STATUS',a.application_no,{application_id:a.id,status:status});toast('放款状态已保存');closeDrawer();await loadCore();renderApplications();loadDashboard()}catch(e){toast('放款状态保存失败：'+e.message)}}
async function sendMessage(){if(!S.detail)return;var a=S.detail.a,title=$('msgTitle').value.trim(),content=$('msgContent').value.trim();if(!title||!content){toast('请填写通知标题和内容');return}try{await api('system_messages',{method:'POST',body:{customer_id:a.customer_id,application_id:a.id,category:'manual_notice',title:title,content:content}});await bestEffortAudit('SEND_SYSTEM_MESSAGE',a.application_no,{application_id:a.id,title:title});$('msgContent').value='';toast('系统通知已发送到客户 APP')}catch(e){toast('发送失败：'+e.message)}}
async function loadSms(silent){try{var rows=await api('sms_outbox?select=*&order=created_at.desc');if(!silent){var html=(rows||[]).map(function(x){var a=S.apps.find(function(z){return String(z.id)===String(x.application_id)});var c=a?S.customers[String(a.customer_id)]||{}:{};return '<tr><td>'+dt(x.scheduled_at||x.created_at)+'</td><td>'+esc(a?a.application_no:'—')+'</td><td>'+esc(c.display_name||c.customer_key||'—')+(c.phone_last4?'<br><span class="muted small">尾号 '+esc(c.phone_last4)+'</span>':'')+'</td><td>'+esc(x.event_code)+'</td><td>'+esc(x.template_code)+'</td><td><span class="badge">'+esc(x.status)+'</span></td><td class="small">'+esc(x.last_error||'')+'</td></tr>'}).join('');$('smsRows').innerHTML=html||'<tr><td colspan="7" class="muted">暂无短信记录</td></tr>'}var pending=(rows||[]).filter(function(x){return x.status==='pending'}).length;$('mSms').textContent=pending;return rows||[]}catch(e){if(!silent)toast('短信记录加载失败：'+e.message);$('mSms').textContent='—';return []}}
async function refreshCurrent(){try{$('cloudState').textContent='正在刷新真实云端…';await loadCore();if(S.current==='applications')renderApplications();if(S.current==='dashboard')loadDashboard();if(S.current==='sms')await loadSms(false);else await loadSms(true);$('cloudState').textContent='真实云端已连接 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch(e){$('cloudState').textContent='云端连接失败：'+e.message;toast(e.message)}}
$('loginBtn').onclick=login;$('password').onkeydown=function(e){if(e.key==='Enter')login()};$('logoutBtn').onclick=logout;$('refreshBtn').onclick=refreshCurrent;$('searchBtn').onclick=renderApplications;$('q').oninput=renderApplications;$('statusFilter').onchange=renderApplications;$('closeDrawerBtn').onclick=closeDrawer;$('drawer').onclick=function(e){if(e.target===$('drawer'))closeDrawer()};$('viewer').onclick=function(e){if(e.target===$('viewer')||e.target.tagName==='IMG')$('viewer').classList.add('hidden')};Array.prototype.forEach.call(document.querySelectorAll('.nav button'),function(b){b.onclick=function(){go(b.getAttribute('data-page'))}});
renewSession().then(async function(){if(!S.user)return;try{var rows=await api('staff_users?select=*&auth_user_id=eq.'+encodeURIComponent(S.user.id));if(rows&&rows[0]&&rows[0].active===true){S.staff=rows[0];$('staffName').textContent=(S.staff.display_name||'工作人员')+' · '+(S.staff.role_code||'staff');showApp();await loadAll()}}catch(e){}});
})();
