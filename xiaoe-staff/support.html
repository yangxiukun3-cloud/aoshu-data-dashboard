<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>小额周转贷｜客服聊天</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f3f6fb;color:#162238}button,input,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginCard{width:min(430px,100%);background:#fff;border:1px solid #e4eaf3;border-radius:20px;padding:26px;box-shadow:0 22px 60px rgba(20,45,80,.12)}.field{width:100%;padding:11px 12px;border:1px solid #d9e2ee;border-radius:10px;margin:7px 0;outline:none}.field:focus{border-color:#1769e0;box-shadow:0 0 0 3px rgba(23,105,224,.08)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#1769e0;color:#fff}.btn.secondary{background:#eef3f8;color:#33465d}.btn.block{width:100%}.muted{color:#708096}.small{font-size:12px}.err{color:#b42318;margin-top:9px;font-size:13px;white-space:pre-wrap}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#14233f;color:#fff;padding:14px 18px}.top h2{margin:0;font-size:18px}.top a{color:#d6e6ff;text-decoration:none;font-size:13px}.layout{display:grid;grid-template-columns:340px 1fr;min-height:0}.threads{background:#fff;border-right:1px solid #e3e9f1;overflow:auto}.threadHead{padding:14px;border-bottom:1px solid #edf1f6;position:sticky;top:0;background:#fff;z-index:2}.thread{padding:13px 14px;border-bottom:1px solid #edf1f6;cursor:pointer}.thread:hover,.thread.active{background:#eef5ff}.threadTop{display:flex;justify-content:space-between;gap:8px}.threadTitle{font-weight:850}.threadMeta{font-size:12px;color:#708096;margin-top:5px}.unread{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#e43d3d;color:#fff;font-size:11px;font-weight:850}.chat{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}.chatHead{background:#fff;border-bottom:1px solid #e5ebf3;padding:14px 18px}.chatHead b{font-size:16px}.chatMessages{overflow:auto;padding:18px}.row{display:flex;margin:9px 0}.row.customer{justify-content:flex-start}.row.staff{justify-content:flex-end}.bubble{max-width:min(720px,82%);padding:11px 13px;border-radius:15px;background:#fff;border:1px solid #e3eaf3;line-height:1.55;word-break:break-word}.row.staff .bubble{background:#1769e0;color:#fff;border-color:#1769e0}.meta{font-size:11px;opacity:.66;margin-bottom:5px}.appRef{font-size:11px;opacity:.7;margin-top:6px}.composer{background:#fff;border-top:1px solid #e4eaf2;padding:14px 18px}.composer textarea{resize:none;min-height:78px}.composeActions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px}.empty{padding:36px;color:#708096;text-align:center}.notice{padding:10px 12px;background:#fff8e9;color:#82540e;border:1px solid #f3d49e;border-radius:10px;font-size:12px;margin-top:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}.threads{max-height:36vh;border-right:0;border-bottom:1px solid #e3e9f1}.chat{min-height:60vh}.bubble{max-width:90%}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginCard"><h2>工作人员客服聊天</h2><div class="muted">使用工作人员账号登录</div><input id="email" class="field" type="email" value="yangxiukun3@gmail.com" placeholder="工作人员邮箱"><input id="password" class="field" type="password" placeholder="密码"><button id="loginBtn" class="btn block">登录客服后台</button><div id="loginErr" class="err"></div><div class="notice">客服聊天仅用于客户沟通，不会自动改变审核、授信、放款或还款状态。</div></div></div>
<div id="app" class="app hidden"><div class="top"><div><h2>客服聊天</h2><div id="cloudState" class="small">正在连接真实云端…</div></div><div><a href="./index.html">← 返回审核后台</a>　<button id="refreshBtn" class="btn secondary">刷新</button> <button id="logoutBtn" class="btn secondary">退出</button></div></div><div class="layout"><aside class="threads"><div class="threadHead"><b>客户会话</b><input id="search" class="field" placeholder="客户姓名 / 申请号"></div><div id="threadList"></div></aside><main class="chat"><div id="chatHead" class="chatHead"><b>请选择客户会话</b><div class="muted small">左侧选择一条会话后查看聊天记录</div></div><div id="chatMessages" class="chatMessages"><div class="empty">暂无选中的客服会话</div></div><div class="composer"><textarea id="reply" class="field" maxlength="4000" placeholder="输入回复内容"></textarea><div class="composeActions"><span class="muted small">回复会写入真实云端，客户 APP 消息页可查看。</span><button id="sendBtn" class="btn">发送回复</button></div></div></main></div></div>
<script>
(function(){'use strict';
var AUTH='https://ep-broad-haze-aw0tk2ug.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth';
var DATA='https://ep-broad-haze-aw0tk2ug.apirest.c-12.us-east-1.aws.neon.tech/neondb/rest/v1';
var S={jwt:null,user:null,staff:null,messages:[],customers:{},apps:{},selectedCustomerId:null,selectedApplicationId:null};
var $=function(id){return document.getElementById(id)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dt(v){return v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'—'}
async function ar(path,opt){opt=opt||{};var r=await fetch(AUTH+path,{method:opt.method||'GET',headers:{'Content-Type':'application/json'},body:opt.body,credentials:'include'});var t=await r.text(),b=null;try{b=t?JSON.parse(t):null}catch(e){b=t}var h=r.headers.get('set-auth-jwt');if(h)S.jwt=h;var j=b&&((b.session&&b.session.access_token)||(b.data&&b.data.session&&b.data.session.access_token)||b.token||(b.data&&b.data.token));if(j)S.jwt=j;var u=b&&(b.user||(b.data&&b.data.user)||(b.session&&b.session.user)||(b.data&&b.data.session&&b.data.session.user));if(u)S.user=u;if(!r.ok)throw new Error((b&&((b.message)||(b.error&&b.error.message)||b.error))||t||('HTTP '+r.status));return b}
async function session(){try{await ar('/get-session')}catch(e){}if(!S.jwt){try{var x=await ar('/token');S.jwt=x&&(x.token||(x.data&&x.data.token))}catch(e){}}return !!(S.jwt&&S.user)}
async function api(path,opt){opt=opt||{};if(!S.jwt)await session();if(!S.jwt)throw new Error('登录状态失效');var r=await fetch(DATA+'/'+path,{method:opt.method||'GET',headers:{Authorization:'Bearer '+S.jwt,Accept:'application/json','Content-Type':'application/json',Prefer:'return=representation'},body:opt.body===undefined?undefined:JSON.stringify(opt.body)});var t=await r.text(),b=null;try{b=t?JSON.parse(t):null}catch(e){b=t}if(!r.ok)throw new Error((b&&((b.message)||(b.details)||(b.hint)))||t||('HTTP '+r.status));return b}
async function verifyStaff(){var rows=await api('staff_users?select=*&auth_user_id=eq.'+encodeURIComponent(S.user.id));if(!rows||!rows[0]||rows[0].active!==true)throw new Error('当前账号没有工作人员权限');S.staff=rows[0];return true}
async function login(){try{$('loginErr').textContent='';await ar('/sign-in/email',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value,rememberMe:true})});await session();await verifyStaff();showApp();await loadAll()}catch(e){$('loginErr').textContent='登录失败：'+e.message}}
async function restore(){try{if(await session()){await verifyStaff();showApp();await loadAll()}}catch(e){}}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('cloudState').textContent='真实云端已连接 · '+(S.staff&&S.staff.display_name||'工作人员')}
async function logout(){try{await ar('/sign-out',{method:'POST',body:'{}'})}catch(e){}location.reload()}
async function loadAll(){var data=await Promise.all([api('support_messages?select=*&order=created_at.asc'),api('customers?select=id,display_name,phone_last4&order=id.desc'),api('loan_applications?select=id,customer_id,application_no,status&order=submitted_at.desc')]);S.messages=data[0]||[];S.customers={};(data[1]||[]).forEach(function(c){S.customers[c.id]=c});S.apps={};(data[2]||[]).forEach(function(a){S.apps[a.id]=a});renderThreads();if(S.selectedCustomerId)selectThread(S.selectedCustomerId,S.selectedApplicationId,false)}
function grouped(){var g={};S.messages.forEach(function(m){var k=String(m.customer_id);if(!g[k])g[k]={customer_id:m.customer_id,last:m,unread:0,application_id:m.application_id||null};g[k].last=m;if(m.application_id)g[k].application_id=m.application_id;if(m.sender_type==='customer'&&!m.read_by_staff_at)g[k].unread++});return Object.values(g).sort(function(a,b){return new Date(b.last.created_at)-new Date(a.last.created_at)})}
function renderThreads(){var q=$('search').value.trim().toLowerCase();var list=grouped().filter(function(x){var c=S.customers[x.customer_id]||{},a=S.apps[x.application_id]||{};return !q||String(c.display_name||'').toLowerCase().includes(q)||String(a.application_no||'').toLowerCase().includes(q)});$('threadList').innerHTML=list.length?list.map(function(x){var c=S.customers[x.customer_id]||{},a=S.apps[x.application_id]||{},active=String(S.selectedCustomerId)===String(x.customer_id);return '<div class="thread'+(active?' active':'')+'" data-customer="'+esc(x.customer_id)+'" data-app="'+esc(x.application_id||'')+'"><div class="threadTop"><span class="threadTitle">'+esc(c.display_name||('客户 #'+x.customer_id))+'</span>'+(x.unread?'<span class="unread">'+x.unread+'</span>':'')+'</div><div class="threadMeta">'+esc(a.application_no||'未关联申请')+' · '+esc(dt(x.last.created_at))+'</div><div class="threadMeta">'+esc(String(x.last.content||'').slice(0,48))+'</div></div>'}).join(''):'<div class="empty">暂无客服消息</div>';$('threadList').querySelectorAll('.thread').forEach(function(x){x.onclick=function(){selectThread(x.dataset.customer,x.dataset.app||null,true)}})}
async function selectThread(customerId,applicationId,mark){S.selectedCustomerId=Number(customerId);S.selectedApplicationId=applicationId?Number(applicationId):null;var c=S.customers[S.selectedCustomerId]||{},a=S.apps[S.selectedApplicationId]||{};$('chatHead').innerHTML='<b>'+esc(c.display_name||('客户 #'+S.selectedCustomerId))+'</b><div class="muted small">'+esc(a.application_no||'未关联具体申请')+(a.status?' · '+esc(a.status):'')+'</div>';if(mark){var unread=S.messages.filter(function(m){return Number(m.customer_id)===S.selectedCustomerId&&m.sender_type==='customer'&&!m.read_by_staff_at});if(unread.length){var now=new Date().toISOString();await Promise.all(unread.map(function(m){return api('support_messages?id=eq.'+encodeURIComponent(m.id),{method:'PATCH',body:{read_by_staff_at:now}})}));unread.forEach(function(m){m.read_by_staff_at=now})}}renderChat();renderThreads()}
function renderChat(){var arr=S.messages.filter(function(m){return Number(m.customer_id)===Number(S.selectedCustomerId)});$('chatMessages').innerHTML=arr.length?arr.map(function(m){var staff=m.sender_type==='staff',a=S.apps[m.application_id]||{};return '<div class="row '+(staff?'staff':'customer')+'"><div class="bubble"><div class="meta">'+(staff?'工作人员':'客户')+' · '+esc(dt(m.created_at))+'</div><div>'+esc(m.content||'')+'</div>'+(m.application_id?'<div class="appRef">'+esc(a.application_no||('申请 #'+m.application_id))+'</div>':'')+'</div></div>'}).join(''):'<div class="empty">暂无聊天记录</div>';$('chatMessages').scrollTop=$('chatMessages').scrollHeight}
async function send(){var text=$('reply').value.trim();if(!S.selectedCustomerId)return alert('请先选择客户会话');if(!text)return;if(text.length>4000)return alert('单条消息不能超过4000字');try{await api('support_messages',{method:'POST',body:{customer_id:S.selectedCustomerId,application_id:S.selectedApplicationId||null,sender_type:'staff',sender_auth_user_id:S.user.id,content:text}});$('reply').value='';await loadAll()}catch(e){alert('发送失败：'+e.message)}}
$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('refreshBtn').onclick=loadAll;$('sendBtn').onclick=send;$('search').oninput=renderThreads;$('reply').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});restore();setInterval(function(){if(!$('app').classList.contains('hidden'))loadAll().catch(function(){})},10000);
})();
</script>
</body>
</html>
