name: Publish R4 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-r4-apk.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify R4
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-3760-8211-a4c5-14525543af06/raw?se=2026-10-29T04%3A26%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=2683681f-7232-5fc3-95e0-554c816fd73c&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T02%3A18%3A19Z&ske=2026-10-30T02%3A18%3A19Z&sks=b&skv=2026-02-06&sig=WE9P1lkMqp6T5ayEeXGxKDJEbiayGaPWnArIwFBTEvM%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/r4.zip
          rm -rf /tmp/r4 && mkdir -p /tmp/r4
          unzip -q /tmp/r4.zip -d /tmp/r4
          APK="$(find /tmp/r4 -maxdepth 2 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "7a2abd196ea91a8335572d4f3ae13c775d02b117523c93c1668207a7c946a590  $APK" | sha256sum -c -
          unzip -p "$APK" assets/app.js > /tmp/app.js
          unzip -p "$APK" assets/index.html > /tmp/index.html
          grep -q 'homeApplicationStatus' /tmp/app.js
          grep -q 'supportUnreadRemote' /tmp/app.js
          grep -q 'setInterval(foregroundSync, 1000)' /tmp/app.js
          ! grep -q '正在同步数据' /tmp/app.js
          ! grep -E '特色贷|SPECIAL_LOAN|syncSpecialStatus|view-special|specialEntry|submitSpecialLoan' /tmp/app.js /tmp/index.html
          mkdir -p download
          cp "$APK" "download/小额易贷.apk"
          cp "$APK" download/xiaoe-loan.apk
          cp "$APK" download/xiaoe-loan-v7.1.12R4.apk
          printf '%s  %s\n' "7a2abd196ea91a8335572d4f3ae13c775d02b117523c93c1668207a7c946a590" "xiaoe-loan-v7.1.12R4.apk" > download/xiaoe-loan-v7.1.12R4.sha256
          printf '%s\n' '{"version":"7.1.12R4","versionCode":71215,"sha256":"7a2abd196ea91a8335572d4f3ae13c775d02b117523c93c1668207a7c946a590","apk":"小额易贷.apk"}' > download/release.json
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "download/小额易贷.apk" download/xiaoe-loan.apk download/xiaoe-loan-v7.1.12R4.apk download/xiaoe-loan-v7.1.12R4.sha256 download/release.json
          git commit -m "Publish 小额易贷 v7.1.12R4 live status release"
          git push
