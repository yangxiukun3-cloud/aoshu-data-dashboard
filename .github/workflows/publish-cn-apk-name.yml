name: Publish Chinese APK filename
# trigger branded filename publisher
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cn-apk-name.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create branded APK filename
        run: |
          set -euo pipefail
          test -f download/xiaoe-loan.apk
          cp download/xiaoe-loan.apk "download/小额易贷.apk"
          python - <<'PY'
import json
p='download/release.json'
d=json.load(open(p,encoding='utf-8'))
d['apk']='小额易贷.apk'
open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
PY
      - name: Commit branded filename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "download/小额易贷.apk" download/release.json
          git commit -m "Use 小额易贷.apk as public download filename"
          git push
